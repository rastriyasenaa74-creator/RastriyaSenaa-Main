<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel | RashtriyaSenaa</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header></header>

<main>
<section class="section">
<div class="container">

<div class="head">
<h2>Admin Panel</h2>
<p>Admin ID and Password are required.</p>
</div>

<div id="loginBox" class="form">

<form id="loginForm">

<div class="formgrid">

<div class="field">
<label>Admin ID *</label>
<input
name="adminId"
type="text"
autocomplete="username"
required>
</div>

<div class="field">
<label>Admin Password *</label>
<input
name="password"
type="password"
autocomplete="current-password"
required>
</div>

</div>

<div class="buttons">
<button
type="submit"
class="btn red">
LOGIN
</button>
</div>

<div id="loginMsg" class="msg"></div>

</form>

</div>


<div id="panel" style="display:none">

<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap">

<h3>Applications</h3>

<div>

<button
type="button"
class="btn red"
id="refreshBtn">
REFRESH
</button>

<button
type="button"
class="btn"
id="logoutBtn">
LOGOUT
</button>

</div>

</div>


<div id="panelMsg" class="msg"></div>


<div class="tablewrap">

<table class="table">

<thead>

<tr>

<th>Application</th>
<th>Name</th>
<th>Mobile</th>
<th>State</th>
<th>Mandal</th>
<th>District</th>
<th>Status</th>
<th>Post</th>
<th>Action</th>

</tr>

</thead>

<tbody id="rows">

<tr>
<td colspan="9">
Applications load karne ke liye login karein.
</td>
</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>
</section>
</main>


<footer></footer>


<script src="site.js"></script>

<script>

let admin = {};


/* =========================================================
   ALL POSTS
   ========================================================= */

const POSTS = [

  "सदस्य",

  "ब्लॉक अध्यक्ष",
  "ब्लॉक उपाध्यक्ष",
  "ब्लॉक महासचिव",
  "ब्लॉक सचिव",

  "तहसील अध्यक्ष",
  "तहसील उपाध्यक्ष",
  "तहसील महासचिव",
  "तहसील सचिव",

  "जिला अध्यक्ष",
  "जिला उपाध्यक्ष",
  "जिला महासचिव",
  "जिला सचिव",

  "मण्डल अध्यक्ष",
  "मण्डल उपाध्यक्ष",
  "मण्डल महासचिव",
  "मण्डल सचिव",

  "प्रदेश अध्यक्ष",
  "प्रदेश उपाध्यक्ष",
  "प्रदेश महासचिव",
  "प्रदेश सचिव",

  "राष्ट्रीय अध्यक्ष",
  "राष्ट्रीय उपाध्यक्ष",
  "राष्ट्रीय महासचिव",
  "राष्ट्रीय सचिव"

];


/* =========================================================
   POST LEVEL
   ========================================================= */

const POST_LEVELS = {

  "सदस्य": "MEMBER",

  "ब्लॉक अध्यक्ष": "BLOCK",
  "ब्लॉक उपाध्यक्ष": "BLOCK",
  "ब्लॉक महासचिव": "BLOCK",
  "ब्लॉक सचिव": "BLOCK",

  "तहसील अध्यक्ष": "TEHSIL",
  "तहसील उपाध्यक्ष": "TEHSIL",
  "तहसील महासचिव": "TEHSIL",
  "तहसील सचिव": "TEHSIL",

  "जिला अध्यक्ष": "DISTRICT",
  "जिला उपाध्यक्ष": "DISTRICT",
  "जिला महासचिव": "DISTRICT",
  "जिला सचिव": "DISTRICT",

  "मण्डल अध्यक्ष": "MANDAL",
  "मण्डल उपाध्यक्ष": "MANDAL",
  "मण्डल महासचिव": "MANDAL",
  "मण्डल सचिव": "MANDAL",

  "प्रदेश अध्यक्ष": "STATE",
  "प्रदेश उपाध्यक्ष": "STATE",
  "प्रदेश महासचिव": "STATE",
  "प्रदेश सचिव": "STATE",

  "राष्ट्रीय अध्यक्ष": "NATIONAL",
  "राष्ट्रीय उपाध्यक्ष": "NATIONAL",
  "राष्ट्रीय महासचिव": "NATIONAL",
  "राष्ट्रीय सचिव": "NATIONAL"

};


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   ROLE NAME
   ========================================================= */

function roleName(role) {

  role = String(role || "").toUpperCase();

  const names = {

    MAIN: "Main Admin",
    NATIONAL: "National Admin",
    STATE: "State Admin",
    MANDAL: "Mandal Admin",
    DISTRICT: "District Admin"

  };

  return names[role] || role;

}


/* =========================================================
   ALLOWED POSTS FOR ADMIN
   ========================================================= */

function allowedPostsForAdmin(role) {

  role = String(role || "").toUpperCase();

  if (role === "MAIN") {

    return POSTS.slice();

  }


  if (role === "NATIONAL") {

    return POSTS.filter(function(post) {

      const level = POST_LEVELS[post];

      return [
        "MEMBER",
        "BLOCK",
        "TEHSIL",
        "DISTRICT",
        "MANDAL",
        "STATE",
        "NATIONAL"
      ].includes(level);

    });

  }


  if (role === "STATE") {

    return POSTS.filter(function(post) {

      const level = POST_LEVELS[post];

      return [
        "MEMBER",
        "BLOCK",
        "TEHSIL",
        "DISTRICT",
        "MANDAL",
        "STATE"
      ].includes(level);

    });

  }


  if (role === "MANDAL") {

    return POSTS.filter(function(post) {

      const level = POST_LEVELS[post];

      return [
        "MEMBER",
        "BLOCK",
        "TEHSIL",
        "DISTRICT",
        "MANDAL"
      ].includes(level);

    });

  }


  if (role === "DISTRICT") {

    return POSTS.filter(function(post) {

      const level = POST_LEVELS[post];

      return [
        "MEMBER",
        "BLOCK",
        "TEHSIL",
        "DISTRICT"
      ].includes(level);

    });

  }


  return ["सदस्य"];

}


/* =========================================================
   POST OPTIONS
   ========================================================= */

function postOptions(selected) {

  selected = String(selected || "सदस्य");

  const role = String(admin.role || "").toUpperCase();

  const allowed = allowedPostsForAdmin(role);

  let html = "";

  allowed.forEach(function(post) {

    html +=
      "<option value=\"" +
      escapeHtml(post) +
      "\"" +
      (post === selected ? " selected" : "") +
      ">" +
      escapeHtml(post) +
      "</option>";

  });


  /*
     अगर current post इस Admin के level से ऊपर है,
     तो उसे dropdown में दिखाएँ लेकिन change करने न दें।
  */

  if (
    selected &&
    !allowed.includes(selected) &&
    POSTS.includes(selected)
  ) {

    html =
      "<option value=\"" +
      escapeHtml(selected) +
      "\" selected disabled>" +
      escapeHtml(selected) +
      " (Higher Level Post)" +
      "</option>" +
      html;

  }


  return html;

}


/* =========================================================
   CHECK WHETHER ADMIN CAN CHANGE CURRENT POST
   ========================================================= */

function canChangePost(currentPost) {

  const role = String(admin.role || "").toUpperCase();

  const allowed = allowedPostsForAdmin(role);

  return allowed.includes(String(currentPost || "सदस्य"));

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(el, text, success) {

  if (!el) return;

  el.className =
    "msg " +
    (success ? "success" : "error");

  el.textContent = text || "";

  el.style.display = "block";

}


/* =========================================================
   LOGIN
   ========================================================= */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const form = e.target;

  const msg =
    document.getElementById("loginMsg");

  const btn =
    form.querySelector("button[type=submit]");


  admin = {

    adminId:
      String(
        form.elements.adminId.value || ""
      ).trim(),

    password:
      String(
        form.elements.password.value || ""
      )

  };


  if (!admin.adminId || !admin.password) {

    showMessage(
      msg,
      "Admin ID aur Password dono enter karo.",
      false
    );

    return;

  }


  btn.disabled = true;

  btn.textContent = "LOGIN...";


  try {

    const r = await api({

      action: "adminLogin",

      adminId: admin.adminId,

      password: admin.password

    });


    if (!r.success) {

      showMessage(
        msg,
        r.message ||
        "Invalid Admin ID or Password.",
        false
      );

      return;

    }


    /*
       Login response se Admin role/scope save
    */

    admin.role =
      r.role ||
      (r.admin && r.admin.role) ||
      "";

    admin.state =
      r.state ||
      (r.admin && r.admin.state) ||
      "";

    admin.mandal =
      r.mandal ||
      (r.admin && r.admin.mandal) ||
      "";

    admin.district =
      r.district ||
      (r.admin && r.admin.district) ||
      "";


    document
      .getElementById("loginBox")
      .style.display = "none";


    document
      .getElementById("panel")
      .style.display = "block";


    await loadApps();


  } catch (err) {

    showMessage(
      msg,
      err.message || "Login failed.",
      false
    );

  } finally {

    btn.disabled = false;

    btn.textContent = "LOGIN";

  }

});


/* =========================================================
   LOAD APPLICATIONS
   ========================================================= */

async function loadApps() {

  const msg =
    document.getElementById("panelMsg");

  const rows =
    document.getElementById("rows");


  rows.innerHTML =
    "<tr><td colspan='9'>" +
    "Loading applications..." +
    "</td></tr>";


  try {

    const r = await api({

      action: "adminList",

      adminId: admin.adminId,

      password: admin.password

    });


    if (!r.success) {

      showMessage(
        msg,
        r.message ||
        "Applications load nahi hui.",
        false
      );

      rows.innerHTML =
        "<tr><td colspan='9'>" +
        "Unable to load applications." +
        "</td></tr>";

      return;

    }


    /*
       अगर backend ने role दिया है
       तो उसे update कर दें।
    */

    if (r.role) {

      admin.role = r.role;

    }


    const apps =
      r.applications || [];


    if (!apps.length) {

      rows.innerHTML =
        "<tr><td colspan='9'>" +
        "No applications found." +
        "</td></tr>";

      msg.style.display = "none";

      return;

    }


    rows.innerHTML = "";


    apps.forEach(function(app) {

      const tr =
        document.createElement("tr");


      /* APPLICATION */

      const application =
        document.createElement("td");

      application.innerHTML =
        escapeHtml(
          app.applicationId || ""
        ) +
        "<br>" +
        escapeHtml(
          app.memberId || ""
        );


      /* NAME */

      const name =
        document.createElement("td");

      name.textContent =
        app.name || "";


      /* MOBILE */

      const mobile =
        document.createElement("td");

      mobile.textContent =
        app.mobile || "";


      /* STATE */

      const state =
        document.createElement("td");

      state.textContent =
        app.state || "";


      /* MANDAL */

      const mandal =
        document.createElement("td");

      mandal.textContent =
        app.mandal || "";


      /* DISTRICT */

      const district =
        document.createElement("td");

      district.textContent =
        app.district || "";


      /* STATUS */

      const status =
        document.createElement("td");

      status.textContent =
        app.status || "";


      /* POST */

      const post =
        document.createElement("td");


      const currentPost =
        String(
          app.post || "सदस्य"
        );


      if (
        String(app.status || "")
        .toUpperCase() === "APPROVED"
      ) {

        const select =
          document.createElement("select");

        select.style.minWidth =
          "180px";

        select.innerHTML =
          postOptions(currentPost);


        /*
           Higher level post होने पर
           dropdown disabled रहेगा।
        */

        if (!canChangePost(currentPost)) {

          select.disabled = true;

        }


        select.id =
          "post_" +
          app.applicationId;


        post.appendChild(select);


      } else {

        post.textContent = "—";

      }


      /* ACTION */

      const action =
        document.createElement("td");


      if (
        String(app.status || "")
        .toUpperCase() === "PENDING"
      ) {

        const approve =
          document.createElement("button");

        approve.type = "button";

        approve.className =
          "btn red";

        approve.textContent =
          "APPROVE";

        approve.onclick =
          function() {

            act(
              app.applicationId,
              "approve"
            );

          };


        const reject =
          document.createElement("button");

        reject.type = "button";

        reject.className =
          "btn";

        reject.textContent =
          "REJECT";

        reject.style.marginLeft =
          "6px";

        reject.onclick =
          function() {

            act(
              app.applicationId,
              "reject"
            );

          };


        action.appendChild(approve);

        action.appendChild(reject);

      }


      else if (
        String(app.status || "")
        .toUpperCase() === "APPROVED"
      ) {

        const save =
          document.createElement("button");

        save.type = "button";

        save.className =
          "btn red";

        save.textContent =
          "SAVE POST";


        if (!canChangePost(currentPost)) {

          save.disabled = true;

          save.title =
            "Higher level Admin ka Post hai.";

        }


        save.onclick =
          function() {

            savePost(
              app.applicationId,
              currentPost
            );

          };


        action.appendChild(save);

      }


      else {

        action.textContent =
          "—";

      }


      tr.append(
        application,
        name,
        mobile,
        state,
        mandal,
        district,
        status,
        post,
        action
      );


      rows.appendChild(tr);

    });


    msg.style.display = "none";


  } catch (err) {

    showMessage(
      msg,
      err.message ||
      "Applications load failed.",
      false
    );


    rows.innerHTML =
      "<tr><td colspan='9'>" +
      "Error loading applications." +
      "</td></tr>";

  }

}


/* =========================================================
   SAVE POST
   ========================================================= */

async function savePost(
  applicationId,
  originalPost
) {

  const select =
    document.getElementById(
      "post_" + applicationId
    );


  if (!select) return;


  if (select.disabled) {

    return;

  }


  const post =
    String(
      select.value || ""
    ).trim();


  if (!post) {

    alert("Post select karo.");

    return;

  }


  if (!confirm(
    "Is member ko \"" +
    post +
    "\" post deni hai?"
  )) {

    return;

  }


  const msg =
    document.getElementById(
      "panelMsg"
    );


  showMessage(
    msg,
    "Post save ho rahi hai...",
    true
  );


  try {

    const r = await api({

      action: "setPost",

      applicationId:
        applicationId,

      post: post,

      adminId:
        admin.adminId,

      password:
        admin.password

    });


    if (!r.success) {

      showMessage(
        msg,
        r.message ||
        "Post save nahi hui.",
        false
      );

      return;

    }


    let text =
      r.message ||
      "Post successfully saved.";


    if (
      r.emailSent === true
    ) {

      text +=
        " Appointment email sent.";

    }


    showMessage(
      msg,
      text,
      true
    );


    await loadApps();


  } catch (err) {

    showMessage(
      msg,
      err.message ||
      "Post save failed.",
      false
    );

  }

}


/* =========================================================
   APPROVE / REJECT
   ========================================================= */

async function act(
  applicationId,
  type
) {

  const action =
    type === "approve"
      ? "approve"
      : "reject";


  if (!confirm(

    action === "approve"

      ? "Is application ko APPROVE karna hai?"

      : "Is application ko REJECT karna hai?"

  )) return;


  const msg =
    document.getElementById(
      "panelMsg"
    );


  showMessage(

    msg,

    action === "approve"

      ? "Application approve ho rahi hai..."

      : "Application reject ho rahi hai...",

    true

  );


  try {

    const r = await api({

      action: action,

      applicationId:
        applicationId,

      adminId:
        admin.adminId,

      password:
        admin.password

    });


    if (!r.success) {

      showMessage(
        msg,
        r.message ||
        "Action failed.",
        false
      );

      return;

    }


    let text =
      r.message ||
      "Action successful.";


    if (
      action === "approve" &&
      r.memberId
    ) {

      text +=
        " Member ID: " +
        r.memberId;

    }


    showMessage(
      msg,
      text,
      true
    );


    await loadApps();


  } catch (err) {

    showMessage(
      msg,
      err.message ||
      "Action failed.",
      false
    );

  }

}


/* =========================================================
   REFRESH
   ========================================================= */

document
.getElementById("refreshBtn")
.onclick = loadApps;


/* =========================================================
   LOGOUT
   ========================================================= */

document
.getElementById("logoutBtn")
.onclick = function() {

  admin = {};


  document
    .getElementById("panel")
    .style.display = "none";


  document
    .getElementById("loginBox")
    .style.display = "block";


  document
    .getElementById("loginForm")
    .reset();


  document
    .getElementById("rows")
    .innerHTML =
      "<tr><td colspan='9'>" +
      "Applications load karne ke liye login karein." +
      "</td></tr>";


  document
    .getElementById("panelMsg")
    .style.display = "none";

};

</script>

</body>
</html>
